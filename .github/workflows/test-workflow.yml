name: test
on: push
jobs:
  test:
    runs-on: ununto-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install NodeJs
        uses: actions/setup-node  
        with:
          node-version: 18
      - name: Install dependencies
        runs: npm Install
      - name: Run tests
        runs: npm test